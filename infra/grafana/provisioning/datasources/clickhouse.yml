apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-ds
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse   # docker-compose 서비스명 (컨테이너 간 통신이므로 localhost 아님)
      port: 9000
      protocol: native
      username: default
      defaultDatabase: default
      tlsSkipVerify: false
    secureJsonData:
      password: ""       # 현재 default 계정에 비밀번호가 설정되어 있지 않음 (infra/docker-compose.yml에 CLICKHOUSE_PASSWORD 미설정)
    editable: true
